<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Station 334 Calls</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><link rel="apple-touch-icon" href="/assets/station-logo.jpeg"><meta name="theme-color" content="#d71920"></head>
<body><main class="app">
<header class="hero"><img src="/assets/station-logo.jpeg" class="logo"><div><div class="kicker">TORONTO FIRE</div><h1>Station 334 Calls</h1><p>P334 & FB334 live apparatus board</p></div></header>
<section class="stats"><div class="stat"><span>Unit</span><strong id="unitStat">P334</strong></div><div class="stat"><span>Current Shift</span><strong id="shiftStat">0</strong></div><div class="stat"><span>Selected Days</span><strong id="totalStat">0</strong></div></section>
<section class="tabs" id="tabs"></section>
<section class="addUnit"><input id="unitInput" placeholder="Add unit e.g. P332"><button id="addBtn">+</button></section>
<section class="controls"><button id="refreshBtn">↻ Refresh</button><select id="daysSelect"><option value="1">1 Day</option><option value="3" selected>3 Days</option><option value="7">7 Days</option><option value="14">14 Days</option></select><div class="status" id="status">Ready.</div></section>
<section id="days"></section></main>
<nav class="bottomNav"><div class="active">▦<br>Board</div><div>◷<br>History</div><div>⌖<br>Map</div><div>🚒<br>Units</div><div>⚙<br>Settings</div></nav>
<script src="/app.js"></script></body></html>
